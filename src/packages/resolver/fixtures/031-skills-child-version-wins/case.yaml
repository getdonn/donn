description: Same skill name in two layers; the later layer's source (and version constraint) wins.
resolve: team/t
expect:
  resolved:
    skills:
      - { name: pr-review, source: "registry://org/skills/pr-review@^2" }
  provenance:
    "skills[pr-review]": team/t
  history:
    - { path: "skills[pr-review]", layer: team/t, kind: override, from: org/base }
  warnings: []
