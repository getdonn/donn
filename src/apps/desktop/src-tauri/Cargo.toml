[package]
name = "donn-desktop"
version = "0.1.0"
description = "The donn menu-bar app (spec 28)"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "donn_desktop"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
